{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h2>{{ title }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="padding: 8px 12px; background-color: #4CAF50; color: white; border-radius: 5px;">Зберегти</button>
</form>

<a href="{% url 'diary' %}" style="margin-top: 10px; display: inline-block;">⬅ Назад до списку учнів</a>
{% endblock %}
