
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Portal Group{% endblock %}</title>
    <!-- Підключення Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-image: url("media/bg.png");
            background-size: cover;        /* розтягує зображення на весь екран */
            background-repeat: no-repeat;  /* не повторює */
            background-position: center;   /* центрує */
            font-family: 'cursive';
        }
        .navbar {
            background-color: #19094d; /* Сірий навбар */
        }
        .bg-navy {
            background-color: #331c5c; /* насичений темно-синій */
            color: #ffffff;
        }
        .bg-materials {
            background-color: #331c5c; /* темно-синій */
            color: #ffffff;
        }
        .footer {
            background-color: #6c757d;
            color: #fff;
            padding: 10px;
            text-align: center;
            position: absolute;
            bottom: 0;
            position: fixed;
            width: 100%;
        }
    </style>

</head>
<body class="{% block body_class %}{% endblock %}">
</body>
<body>
    <!-- Навігаційна панель -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="http://127.0.0.1:8000">Portal Group</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
            <a class="nav-link active" aria-current="page" href="{% url 'accounts:profile' %}">{{ user.username }}</a>
            <a class="nav-link active" aria-current="page" href="{% url 'accounts:logout' %}">Вийти</a>
        {% else %}
            <a class="nav-link active" aria-current="page" href="{% url 'accounts:login' %}">Увійти</a>
            <a class="nav-link active" aria-current="page" href="{% url 'accounts:register' %}">Зареєструватися</a>
        {% endif %}
         
      </ul>
    </div>
  </div>
</nav>

    <!-- Основний контент -->
    <div class="container mt-4">
        {% block content %}
        <h1>Ласкаво просимо!</h1>
        <p>Це базова сторінка, яку можна розширювати.</p>
        {% endblock %}
    </div>

    <!-- Footer -->


    <!-- Підключення Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
