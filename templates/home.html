{% extends "base.html" %}

{% block title %}Головна сторінка{% endblock %}

{% block content %}
<h1>Вітаємо на порталі групи!</h1>

<!-- Горизонтальное меню -->
<div style="display: flex; gap: 20px; margin-bottom: 20px;">
    <a href="/events/" style="text-decoration: none; padding: 8px 12px; background-color: #4CAF50; color: white; border-radius: 5px;">Календар подій</a>
    <a href="/polls/" style="text-decoration: none; padding: 8px 12px; background-color: #2196F3; color: white; border-radius: 5px;">Опитування</a>

    {% if user.is_staff %}
        <a href="{% url 'create_poll' %}" style="text-decoration: none; padding: 8px 12px; background-color: #f44336; color: white; border-radius: 5px;">➕ Добавить опрос</a>
    {% endif %}
</div>
{% endblock %}
