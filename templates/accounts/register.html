{% extends 'base/_base.html' %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
    <h2>Реєстрація</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        {% if form.errors %}
            <p style="color: red;">{{ form.errors }}</p>
        {% endif %}
        <button type="submit">Зареєструватися</button>
    </form>
    <p><a href="{% url 'accounts:login' %}">Увійти</a></p>
{% endblock %}
