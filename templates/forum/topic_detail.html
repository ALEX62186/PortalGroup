{% extends 'base/_base.html' %}
{% block content %}
<h2>{{ thread.title }}</h2>
<h2>{{ thread.description }}</h2>
<h2>{{ thread.created_by }}</h2>

<h3>Коментарі:</h3>
{% for post in posts %}
  <p><strong>{{ post.author }}</strong>: {{ post.content }}</p>
{% endfor %}

<h4>Додати коментар:</h4>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Надіслати</button>
</form>
{% endblock %}
