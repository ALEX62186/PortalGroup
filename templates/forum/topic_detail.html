{% extends 'base/_base.html' %}
{% block content %}
<h2>{{ topic.title }}</h2>
{% if can_edit %}
  <a href="{% url 'forum:edit_topic' topic.id %}">Редагувати тему</a>
{% endif %}

<h3>Коментарі:</h3>
{% for post in posts %}
  <p><strong>{{ post.author }}</strong>: {{ post.content }}</p>
{% endfor %}

<h4>Додати коментар:</h4>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Надіслати</button>
</form>
{% endblock %}
