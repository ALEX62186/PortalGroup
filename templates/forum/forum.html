{% extends 'base/_base.html' %}
{% block content %}
<h2>Форум</h2>
<a href="{% url 'forum:thread_create' %}">Додатю</a>
<ul>
{% for topic in topics %}
    <li><a href="{% url 'forum:thread_detail' topic.id %}">{{ topic.title }}</a></li>
{% empty %}
    <li>Подій поки що немає</li>
{% endfor %}
</ul>
{% endblock %}
