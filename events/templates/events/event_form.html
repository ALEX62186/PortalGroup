{% extends 'base/_base.html' %}

{% block body_class %}
  bg-materials
{% endblock %}

{% block content %}
<div style="max-width:600px; margin:0 auto; color:white; padding:25px; border:1px solid #ddd; border-radius:10px; background-color:#262626;">
    <h2 style="text-align:center; color:white; margin-bottom:20px;">📅 Додати нову подію</h2>

    <form method="post" style="display:flex; flex-direction:column; gap:15px;">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit"
                style="background-color:#28a745; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-size:16px;">
            ✅ Зберегти подію
        </button>
    </form>
</div>
{% endblock %}
