{% extends "base.html" %}

{% block content %}
<h2>Результаты опроса: {{ poll.title }}</h2>

<ul>
  {% for choice in poll.choices.all %}
    <li>{{ choice.text }} — {{ choice.votes }} голосов</li>
  {% empty %}
    <li>Варианты ответов не добавлены.</li>
  {% endfor %}
</ul>

<a href="{% url 'poll_list' %}">Назад к списку опросов</a>
{% endblock %}
