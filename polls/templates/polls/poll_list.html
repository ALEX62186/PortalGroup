{% extends 'base/_base.html' %}
{% block content %}

<h1>Список опросов</h1>
<ul>
{% for poll in polls %}
    <li>
        <a href="{% url 'poll_detail' poll.id %}">{{ poll.title }}</a>
    </li>
    {% if user.is_staff %}
        <a class="nav-link active" aria-current="page" href="{% url 'create_poll' %}">➕ Добавить опрос</a>
    {% endif %}
{% empty %}
    <li>Пока что нет опросов</li>
{% endfor %}
</ul>
{% endblock %}
